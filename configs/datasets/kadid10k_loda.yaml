# Official LoDa protocol, mapped to the SCQ-Mamba data store.
dataset:
  name: kadid10k
  available: true
  divide_dataset_per_gpu: true
  root: /home/ssd/IQA/kadid10k
  source_image_root: /home/ssd/IQA/kadid10k/images
  metadata: /home/ssd/IQA/kadid10k/image_labeled_by_per_noise.csv
  metadata_format: csv
  image_column: image
  score_column: dmos
  # The local column is named dmos but contains KADID MOS (higher is better),
  # matching the values consumed directly by LoDa.
  score_type: mos
  reference_column: reference
  distortion_column: noise
  data_num: 10125
  train_data_num: 8100
  test_data_num: 2025
  resize_shorter_edge: 384
  crop_size: 224
  interpolation: bicubic
  normalization: imagenet
  split:
    method: reference_disjoint_80_20
    ratio: [0.8, 0.2]
    seed: 3407
    count: 10
    implementation: sequential_in_place_shuffle
    reference_order: sorted
    validation_indices: []
train_transform:
  patch_num: 3
  random_crop: 224
  random_horizontal_flip: 0.5
  random_vertical_flip: 0.5
test_transform:
  patch_num: 15
  random_crop: 224
