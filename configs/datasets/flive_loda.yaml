# Official LoDa protocol, mapped to the SCQ-Mamba data store.
dataset:
  name: flive
  available: true
  divide_dataset_per_gpu: true
  root: /home/ssd/IQA/FLIVE
  source_image_root: /home/ssd/IQA/FLIVE
  metadata: /home/ssd/IQA/FLIVE/labels_image.csv
  metadata_format: csv
  image_column: name
  score_column: mos
  score_type: mos
  data_num: 39810
  train_data_num: 31848
  test_data_num: 7962
  resize_shorter_edge: 384
  crop_size: 224
  interpolation: bicubic
  normalization: imagenet
  split:
    method: random_image_80_20
    ratio: [0.8, 0.2]
    seed: 3407
    count: 10
    implementation: sequential_in_place_shuffle
    validation_indices: []
train_transform:
  patch_num: 1
  random_crop: 224
  random_horizontal_flip: 0.5
  random_vertical_flip: 0.5
test_transform:
  patch_num: 15
  random_crop: 224
