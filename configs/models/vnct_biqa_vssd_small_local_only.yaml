# Local-only ablation: no selector, ROI refinement, extra NC-SSD, or
# enhancement-source cross-attention.
model:
  name: vnct_biqa
  backbone: vssd_small_ncm3
  preset: vssd_iccv2025_camera_ready_small
  pretrained: checkpoints/vssd_small_mesa.pth
  out_indices: [0, 1, 2, 3]
  feature_channels: [96, 192, 384, 768]
  initialization_config: configs/models/initialization/train.yaml
  mimo_rank: 4
  head: joint_stage_quality
  training_policy: new_modules_only
  trainable_groups: [ncm3_adapter, local_path, local_interaction, quality_head]

selector:
  name: none

local_path:
  enabled: true
  stages: [0, 1, 2, 3]
  dilation: 2
  ffn_ratio: 3.0
  preserve_spatial_map: true

# Shape entries remain declared for builder validation but no refiner modules
# are constructed while enabled=false.
refinement:
  enabled: false
  stages: []
  roi_sizes: [14, 7, 4]
  state_dims: [12, 24, 48]
  num_heads: [4, 4, 8]
  tokens_per_roi: 0

interaction:
  name: unified_local_evidence
  equation: concat_linear_gelu_linear
  local_grid_size: 7
  local_tokens: 49
  inner_dims: [96, 192, 192, 192]
  num_heads: 4
  positional_encoding: continuous_2d_sincos

quality_head:
  name: joint_stage_quality
  grid_size: 7
  tokens_per_stage: 49
  embed_dim: 192
  num_heads: 4
  depth: 1
  mlp_ratio: 3.0
  dropout: 0.0
  spatial_weight_init: uniform
  stage_weight_init: uniform
